<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>方位表示アプリ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>方位表示</h1>

    <div class="compass-wrap">
      <div class="compass" id="compass">
        <div class="ring">
          <span class="label n">N</span>
          <span class="label e">E</span>
          <span class="label s">S</span>
          <span class="label w">W</span>
        </div>
        <div class="needle" id="needle">
          <div class="needle-n"></div>
          <div class="needle-s"></div>
        </div>
        <div class="center-dot"></div>
      </div>
    </div>

    <div class="readout">
      <div class="degree" id="degree">--°</div>
      <div class="direction" id="direction">方位不明</div>
    </div>

    <button id="startBtn" class="start-btn">方位センサーを開始</button>
    <p class="status" id="status">ボタンを押してセンサーへのアクセスを許可してください。</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
